        stroke: #ffffff;
        stroke-width: 6;
      }
      .callout-number {
        fill: #ffffff;
        font-family: Arial, Tahoma, sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .target {
        fill: #111827;
        stroke: #ffffff;
        stroke-width: 3;
      }
    </style>

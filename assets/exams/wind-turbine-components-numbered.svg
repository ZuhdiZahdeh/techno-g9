     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">مخطط نشاط: مكونات عنفة رياح</title>
  <desc id="diagram-description">رسم تخطيطي جانبي مقطعي لعنفة رياح أفقية المحور، مع ثمانية مؤشرات رقمية لاختبار تسمية الأجزاء.</desc>

  <defs>
    <marker id="arrowhead"

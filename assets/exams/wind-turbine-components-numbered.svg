        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail {
        fill: none;
        stroke: #0b2946;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .leader {
        fill: none;
        stroke: #111827;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowhead);
      }
      .callout {
